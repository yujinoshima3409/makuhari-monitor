name: Makuhari facility availability monitor

on:
  schedule:
    # 1時間おきに実行(UTC基準)。頻度を変えたい場合はcron式を調整してください。
    - cron: "0 * * * *"
  workflow_dispatch: {}   # 手動実行用ボタンも使えるように

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run monitor
        env:
          MWPS_USER_ID: ${{ secrets.MWPS_USER_ID }}
          MWPS_PASSWORD: ${{ secrets.MWPS_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO_EMAIL: ${{ secrets.NOTIFY_TO_EMAIL }}
          WEEKS_AHEAD: "10"
          HEADLESS: "true"
        run: python monitor.py

      - name: Commit updated state.json
        run: |
          git config user.name "makuhari-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update availability state [skip ci]"
          git push
